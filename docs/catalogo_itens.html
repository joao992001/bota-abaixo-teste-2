<title>Catálogo de Itens Novos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: filtro por modo no topo; grade de cartas de item (ícone grande, nome, modos, efeito); barra fixa com o que foi marcado */
:root{
  --bg:#f3eee4; --paper:#fffaf0; --ink:#2b2233; --soft:#6b5a70; --chip:#efe5d3; --shadow:rgba(43,34,51,.16);
  --derruba:#e8503a; --batata:#d9932b; --rei:#c9a227; --fuga:#3a8fd9; --ok:#2f9e5b;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  --barbg:#2b2233; --barfg:#fffaf0; --iconbg:#fbe9c8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d1824; --paper:#2a2333; --ink:#f4ecdf; --soft:#c2b3c6; --chip:#3a3044; --shadow:rgba(0,0,0,.4);
  --barbg:#0f0c14; --barfg:#f4ecdf; --iconbg:#3b3045; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1824; --paper:#2a2333; --ink:#f4ecdf; --soft:#c2b3c6; --chip:#3a3044; --shadow:rgba(0,0,0,.4);
  --barbg:#0f0c14; --barfg:#f4ecdf; --iconbg:#3b3045; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 110px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5vw,3rem);margin:0;line-height:1.05;text-wrap:balance}
header p{margin:.5rem 0 0;max-width:70ch;color:var(--soft)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:600 .95rem var(--display);padding:7px 14px;border-radius:999px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--shadow);display:flex;flex-direction:column;min-width:0}
.card.on{outline:4px solid var(--ok);outline-offset:-1px}
.top{display:flex;gap:12px;padding:12px 12px 0;align-items:center}
.ico{width:84px;height:84px;flex:none;background:var(--iconbg);border-radius:16px;border:3px solid var(--ink);display:grid;place-items:center}
.ico svg{width:70px;height:70px}
.top h3{font-family:var(--display);font-size:1.2rem;margin:0;line-height:1.1}
.modes{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.modes span{font:600 .72rem var(--display);color:#fff;border-radius:999px;padding:1px 8px;letter-spacing:.03em}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.body p{margin:0}
.uso{font-size:.85rem;color:var(--soft);background:var(--chip);border-radius:8px;padding:5px 8px}
.pick{margin-top:auto;display:flex;align-items:center;gap:8px;font:600 .95rem var(--display);cursor:pointer;border:3px solid var(--ink);border-radius:12px;padding:7px 10px;background:var(--paper)}
.pick input{width:20px;height:20px;accent-color:var(--ok)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--barbg);color:var(--barfg);z-index:5;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center}
.bar b{font:600 1rem var(--display)}
.bar button{font:700 1rem var(--display);padding:8px 16px;border-radius:12px;border:3px solid var(--barfg);background:var(--rei);color:#2b2233;cursor:pointer}
#saida{flex-basis:100%;max-width:900px;min-height:90px;font:inherit;background:var(--paper);color:var(--ink);border-radius:10px;padding:8px}
button:focus-visible,.pick:focus-within{outline:3px solid var(--fuga);outline-offset:2px}
</style>

<div class="wrap">
<header>
  <h1>Catálogo de itens novos</h1>
  <p>40 ideias de itens para Bota-Abaixo, 10 pensadas para cada modo (alguns servem para mais de um). Os ícones são esboços no estilo do jogo; os definitivos o artista desenha depois da escolha. Marque <b>Quero no jogo</b> nos que gostar, copie e cole no chat.</p>
</header>
<div class="filters" id="filtros"></div>
<div class="grid" id="grade"></div>
</div>
<div class="bar"><b id="cnt">0 marcados</b><button id="copiar" type="button">Copiar escolhidos</button><textarea id="saida" readonly hidden aria-label="Itens escolhidos"></textarea></div>

    c.className = "card" + (pick[nome] ? " on" : "");
    c.innerHTML = `<div class="top"><div class="ico"><svg viewBox="0 0 64 64" aria-hidden="true">${I[ic]}</svg></div><div><h3>${nome}</h3><div class="modes">${modos.map(m => `<span style="background:var(--${m})">${M[m]}</span>`).join("")}</div></div></div>
      <div class="body"><p>${efeito}</p><div class="uso">${uso}</div>
      <label class="pick"><input type="checkbox" id="p${i}" ${pick[nome] ? "checked" : ""}> Quero no jogo</label></div>`;
    c.querySelector("input").addEventListener("change", e => { pick[nome] = e.target.checked; if (!e.target.checked) delete pick[nome]; c.classList.toggle("on", e.target.checked); save(); upd(); });
    grade.append(c);
  });
}
const fl = document.getElementById("filtros");
[["todos","Todos (40)"],["derruba","Derruba"],["batata","Batata-Dinamite"],["rei","Rei da Obra"],["fuga","Fuga"]].forEach(([k, t]) => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = t; b.setAttribute("aria-pressed", k === filtro);
  b.onclick = () => { filtro = k; fl.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); };
  fl.append(b);
});
function upd() { document.getElementById("cnt").textContent = Object.keys(pick).length + " marcados"; }
render(); upd();
document.getElementById("copiar").onclick = async () => {
  const t = document.getElementById("saida");
  t.value = "ITENS ESCOLHIDOS: " + (Object.keys(pick).join(", ") || "nenhum");
  t.hidden = false;
  const b = document.getElementById("copiar");
  try { await navigator.clipboard.writeText(t.value); b.textContent = "Copiado! Cole no chat"; }
  catch (e) { t.focus(); t.select(); b.textContent = "Selecionado: copie e cole"; }
  setTimeout(() => b.textContent = "Copiar escolhidos", 3000);
};
</script>
